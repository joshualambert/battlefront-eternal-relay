services:
  relay:
    image: ${APP_IMAGE:?APP_IMAGE required}
    container_name: battlefront-eternal-relay-production
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.75
    tmpfs:
      - /run/bfe:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000,mode=0700
    environment:
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET required}
      PUBLIC_IPV4: 139.144.48.72
      PUBLIC_IPV6: 2600:3c02::2000:34ff:fe00:7583
    volumes:
      - /opt/battlefront-eternal/certs:/certs:ro
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
